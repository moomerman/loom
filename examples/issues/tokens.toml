# Design tokens for the issue tracker: every color, spacing, radius, font
# size and shadow its styles use, including the names the starter kit's
# components in ui/ need. Colors with { light, dark } follow the system's
# color scheme, or <html data-theme="light|dark">. The palette is a quiet
# neutral with one indigo accent; status, priority, label and avatar
# colors are named tokens so data picks a class, never a raw color.

[color]
page        = { light = "#ffffff", dark = "#111113" }
on-page     = { light = "#1b1c1f", dark = "#e4e5e9" }
surface     = { light = "#ffffff", dark = "#18191c" }
on-surface  = { light = "#1b1c1f", dark = "#e4e5e9" }
sidebar     = { light = "#f6f6f8", dark = "#0c0c0e" }
on-sidebar  = { light = "#3c3f46", dark = "#c9cbd1" }
subtle      = { light = "#f0f0f3", dark = "#222328" }
on-subtle   = { light = "#1b1c1f", dark = "#e4e5e9" }
group       = { light = "#f7f7f9", dark = "#16171a" }
hover       = { light = "#f3f3f5", dark = "#1d1e22" }
selected    = { light = "#eaebf0", dark = "#26272d" }
muted       = { light = "#6b6f76", dark = "#8b8f98" }
faint       = { light = "#9da1a8", dark = "#62666e" }
line        = { light = "#e6e6ea", dark = "#26272c" }
line-strong = { light = "#d4d5da", dark = "#34363c" }
focus       = { light = "#5e6ad2", dark = "#8a93ef" }
accent      = { light = "#5763cf", dark = "#8a93ef" }
on-accent   = { light = "#ffffff", dark = "#111113" }
danger      = { light = "#c52e2e", dark = "#f07575" }
on-danger   = { light = "#ffffff", dark = "#111113" }
success     = { light = "#1d7a4b", dark = "#5cc792" }
on-success  = { light = "#ffffff", dark = "#111113" }
warning     = { light = "#fff4dc", dark = "#3a2f12" }
on-warning  = { light = "#5b3d00", dark = "#f6dfa6" }
backdrop    = { light = "rgb(20 20 30 / 0.28)", dark = "rgb(0 0 0 / 0.6)" }

# Issue status icons.
status-backlog  = { light = "#9da1a8", dark = "#7b7f88" }
status-todo     = { light = "#8b8f97", dark = "#a0a4ad" }
status-progress = { light = "#e8a90b", dark = "#f2c94c" }
status-review   = { light = "#26a269", dark = "#4cb782" }
status-done     = { light = "#5e6ad2", dark = "#8a93ef" }
status-canceled = { light = "#9da1a8", dark = "#7b7f88" }
urgent          = { light = "#f2622b", dark = "#fc7840" }

# Labels and avatars: data names one of these.
red    = { light = "#e5484d", dark = "#f2555a" }
orange = { light = "#f76b15", dark = "#ff8b3e" }
amber  = { light = "#d99a06", dark = "#f5bf2a" }
green  = { light = "#30a46c", dark = "#3dd68c" }
teal   = { light = "#12a594", dark = "#0bd8b6" }
sky    = { light = "#0c8ce9", dark = "#4cb6ff" }
indigo = { light = "#3e63dd", dark = "#849dff" }
violet = { light = "#6e56cf", dark = "#a18ff5" }
pink   = { light = "#d6409f", dark = "#f17fc3" }
rose   = { light = "#e54666", dark = "#ff8095" }
slate  = { light = "#8b8d98", dark = "#9fa1ad" }

[space]
px = "1px"
0-5 = "0.125rem"
1 = "0.25rem"
1-5 = "0.375rem"
2 = "0.5rem"
3 = "0.75rem"
4 = "1rem"
5 = "1.25rem"
6 = "1.5rem"
8 = "2rem"
10 = "2.5rem"
12 = "3rem"
dialog-top = "12vh"

[radius]
sm = "4px"
md = "6px"
lg = "10px"
full = "999px"

[text]
tiny = "0.5625rem"
xs = "0.6875rem"
sm = "0.75rem"
md = "0.8125rem"
lg = "0.9375rem"
xl = "1.125rem"
title = "1.5rem"

[font]
body = 'Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif'
mono = 'ui-monospace, SFMono-Regular, Menlo, monospace'

[shadow]
sm = "0 1px 2px rgb(0 0 0 / 0.06)"
md = "0 4px 12px rgb(0 0 0 / 0.08), 0 1px 3px rgb(0 0 0 / 0.06)"
lg = "0 16px 48px rgb(0 0 0 / 0.18), 0 2px 8px rgb(0 0 0 / 0.08)"
row-focus = { light = "inset 2px 0 0 #5763cf", dark = "inset 2px 0 0 #8a93ef" }

[duration]
fast = "120ms"
