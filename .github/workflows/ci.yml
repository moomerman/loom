name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # Everything but the browser tests, on the latest Go, with Postgres so
  # no test skips (the S3 tests run against a fake S3 in the test). go
  # vet's stdversion check catches use of standard library API newer
  # than go.mod's minimum.
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go vet ./...
      - run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - name: staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.8.2 ./...
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...
      - name: all tests on Postgres (data layer, jobs and storage conformance suites, examples)
        env:
          LOOM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/loom_test
        run: go test -race ./...
      - name: fuzz the parser briefly
        run: go test -run '^$' -fuzz=FuzzParse -fuzztime=30s ./compiler/parser

  browser:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: loom_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: headless Chrome tests
        working-directory: e2e
        env:
          LOOM_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/loom_test
        run: LOOM_CHROME=$(which google-chrome) go test -v ./...
